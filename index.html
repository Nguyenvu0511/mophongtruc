                questions: [
                    { correct: 3, q: "Câu 1: Bánh xe quay 3,0 rad/s, thời gian hoàn thành 1 vòng?", options: ["A. 0,33 s", "B. 0,67 s", "C. 1,0 s", "D. 2,1 s"], experiment: "📍 Một vòng tròn = góc quét 2π rad. Thời gian 1 vòng T = 2π / ω = 2π ÷ 3 ≈ 2.09 s." },
                    { correct: 0, q: "Câu 2: 10 giây sau bật quạt, quạt đạt 300 vòng/phút. Gia tốc góc TB?", options: ["A. 3,14 rad/s².", "B. 30 rad/s².", "C. 30 Vòng/s².", "D. 50 vòng/phút²."], experiment: "📍 Đổi 300 vòng/phút ra Rad: (300 × 2π) ÷ 60 = 10π rad/s. α = ω / t = 10π ÷ 10 = 3.14 rad/s²." },
                    { correct: 0, q: "Câu 3: Đĩa quay đều, điểm Q ở rìa xa tâm gấp 3 lần điểm P sát lõi. Vận tốc góc của Q so với P:", options: ["A. bằng nhau.", "B. gấp 3.", "C. nhỏ hơn 3."], experiment: "📍 Chấm 2 điểm đỏ. Khi đĩa quay 1 vòng, cả 2 điểm hoàn thành cùng lúc! Góc quét mỗi giây BẰNG NHAU. Q chỉ đi nhanh hơn tuyến tính (v=rω) do R lớn!" },
                    { correct: 1, q: "Câu 4: Quạt trực thăng quay 6,5 vòng/s. Vận tốc tuyến tính điểm r=6.7m và r=9.7m?", options: ["A. 19.5; 43.6", "B. 273 m/s; 396 m/s", "C. 122; 273"], experiment: "📍 ω = 6.5×2π = 40.84 rad/s. v = R.ω. => v1 = 6.7×40.84=273.6 m/s. v2 = 9.7×40.84=396 m/s." },
                    { correct: 1, q: "Câu 5: Trái Đất tự quay. Đứng ở đâu tốc độ tuyến tính vòng quay NHỎ NHẤT?", options: ["A. Xích đạo.", "B. Cực nam hoặc cực bắc.", "C. Chỗ nào cũng như nhau."], experiment: "📍 Tại Cực Bắc (lõi trụ), R=0, bạn chỉ tự xoay vòng tròn. Càng đi bộ về Xích đạo, bạn càng bị vòng quay quăng đi tốc độ khủng khiếp! Cực là nhỏ nhất." }
                ]
            }
        ];

        // Rút gọn Guide HTML để Code nhẹ
        const GUIDE_CONTENT = `
            <div class="space-y-6 animate-fade-in text-gray-800 p-2 sm:p-4 pb-12">
                <div class="text-center mb-6">
                    <h2 class="text-3xl font-bold text-blue-700 pb-2 uppercase">Hướng dẫn & Mẹo Ôn Tập</h2>
                </div>
                <div class="bg-white p-5 rounded-xl border-l-4 border-blue-500 shadow-md">
                    <h3 class="text-lg font-bold flex items-center text-blue-800 mb-3 uppercase tracking-wider">${ICONS.calculator} Mẹo Casio 580VNX</h3>
                    <ul class="list-none space-y-3 text-sm text-gray-700">
                        <li><b>1.</b> Giải khoảng cách / thời gian rơi: Dùng <b>MENU 9 2 2</b> (HPT Bậc 2).</li>
                        <li><b>2.</b> Tổng hợp Lực / Động lượng Vector: Bấm <b>MENU 2 (Số phức)</b>. VD: <code>3∠0 + 5∠135</code> ấn = rồi <b>OPTN ⬇ 1</b> lấy độ lớn.</li>
                        <li><b>3.</b> Đổi đơn vị: Degree (Mặt phẳng nghiêng): <b>SHIFT MENU 2 1</b>. Radian (Quay chương 10): <b>SHIFT MENU 2 2</b>.</li>
                    </ul>
                </div>
                <div class="bg-white p-5 rounded-xl border-l-4 border-green-500 shadow-md">
                    <h3 class="text-lg font-bold flex items-center text-green-800 mb-3 uppercase tracking-wider">${ICONS.beaker} Thuật Toán Anki Active Recall</h3>
                    <p class="text-sm text-gray-700 mb-2">Bí kíp học trắc nghiệm: Sau khi trả lời, <b>đọc thí nghiệm giải thích</b> rồi TỰ ĐÁNH GIÁ bằng các nút ở dưới:</p>
                    <ul class="list-none space-y-1 text-sm text-gray-700 bg-gray-50 p-3 rounded">
                        <li>🔴 <b>Lại/Khó:</b> Câu hỏi sẽ lặp lại <b>bất thình lình</b> ở ngay 1-3 câu tiếp theo để nhắc nhớ.</li>
                        <li>🟢 <b>Tốt/Dễ:</b> Thu gọn câu hỏi, tính là Đã Thuộc (Lên lịch nhắc vào ngày mai).</li>
                    </ul>
                </div>
            </div>`;

        const app = {
            state: {
                activeChapter: CHAPTER_DATA[0].id,
                activeTab: 'guide', 
                sidebarOpen: false,
                // Lưu session Anki cho mỗi chương
                sessions: {} 
            },

            init() {
                CHAPTER_DATA.forEach(ch => {
                    // 1. CHUẨN BỊ MẢNG CÂU HỎI
                    let initialQueue = ch.questions.map((_, i) => ({ instId: `inst_${i}_initial`, qIndex: i }));
                    
                    // 2. THUẬT TOÁN SHUFFLE (XÁO TRỘN NGẪU NHIÊN)
                    for (let i = initialQueue.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [initialQueue[i], initialQueue[j]] = [initialQueue[j], initialQueue[i]];
                    }

                    this.state.sessions[ch.id] = {
                        queue: initialQueue, // Hàng đợi hiển thị (đã trộn random)
                        answers: {}, // instId -> optIndex
                        ankiRatings: {}, // instId -> rating ('again', 'good'...)
                        completedSet: new Set() // Tracks unique qIndex completed
                    };
                });
                this.renderSidebar();
                this.renderTabs();
                this.renderMain();
            },

            toggleSidebar() {
                this.state.sidebarOpen = !this.state.sidebarOpen;
                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('sidebar-overlay');
                
                if (this.state.sidebarOpen) {
                    sidebar.classList.remove('hidden');
                    sidebar.classList.add('flex');
                    overlay.classList.remove('hidden');
                } else {
                    sidebar.classList.add('hidden');
                    sidebar.classList.remove('flex');
                    overlay.classList.add('hidden');
                }
            },

            setChapter(chapterId) {
                this.state.activeChapter = chapterId;
                if (this.state.activeTab === 'guide') this.state.activeTab = 'theory';
                if (window.innerWidth < 1024) this.toggleSidebar(); 
                this.renderSidebar();
                this.renderTabs();
                this.renderMain();
            },

            setTab(tabId) {
                this.state.activeTab = tabId;
                this.renderTabs();
                this.renderMain();
            },

            handleAnswer(instId, optIndex) {
                const session = this.state.sessions[this.state.activeChapter];
                session.answers[instId] = optIndex;
                this.renderMain();
            },

            handleAnki(instId, qIndex, rating) {
                const session = this.state.sessions[this.state.activeChapter];
                session.ankiRatings[instId] = rating;

                if (rating === 'again' || rating === 'hard') {
                    // 3. THUẬT TOÁN NHẮC LẠI "THÌNH LÌNH" (SPACED REPETITION)
                    // Lấy vị trí của câu vừa làm xong
                    const currentIndex = session.queue.findIndex(item => item.instId === instId);
                    
                    // Nếu 'Lại': Nhét vào lặp lại sau 1-2 câu. Nếu 'Khó': Nhét lặp lại sau 3-4 câu
                    let step = (rating === 'again') ? Math.floor(Math.random() * 2) + 2 : Math.floor(Math.random() * 2) + 4;
                    let insertIndex = currentIndex + step;
                    
                    // Giới hạn không cho chèn lố chiều dài hàng đợi
                    if (insertIndex > session.queue.length) {
                        insertIndex = session.queue.length;
                    }

                    // Chèn bản sao mới của câu hỏi vào đúng vị trí để nó nhảy ra thình lình
                    session.queue.splice(insertIndex, 0, {
                        instId: `inst_${qIndex}_${Date.now()}`,
                        qIndex: qIndex
                    });
                } else if (rating === 'good' || rating === 'easy') {
                    // Mark as completely done
                    session.completedSet.add(qIndex);
                }
                
                this.renderMain();
            },

            renderTabs() {
                const tabsContainer = document.getElementById('nav-tabs');
                const getBtnClass = (isActive) => isActive 
                    ? 'flex items-center px-3 py-1.5 rounded-md text-sm font-medium transition-colors bg-white text-blue-700 shadow'
                    : 'flex items-center px-3 py-1.5 rounded-md text-sm font-medium transition-colors text-blue-100 hover:bg-blue-700';

                tabsContainer.innerHTML = `
                    <button onclick="app.setTab('guide')" class="${getBtnClass(this.state.activeTab === 'guide')}">
                        ${ICONS.guide} <span class="ml-2 hidden md:block">Hướng dẫn</span>
                    </button>
                    <button onclick="app.setTab('theory')" class="${getBtnClass(this.state.activeTab === 'theory')}">
                        ${ICONS.theory} <span class="ml-2 hidden sm:block">Lý thuyết</span>
                    </button>
                    <button onclick="app.setTab('quiz')" class="${getBtnClass(this.state.activeTab === 'quiz')}">
                        ${ICONS.quiz} <span class="ml-2 hidden sm:block">Bài tập Anki</span>
                    </button>
                `;
            },

            renderSidebar() {
                const nav = document.getElementById('sidebar-nav');
                nav.innerHTML = CHAPTER_DATA.map(ch => {
                    const isActive = this.state.activeChapter === ch.id && this.state.activeTab !== 'guide';
                    const activeClasses = isActive 
                        ? 'bg-blue-50 text-blue-700 border-l-4 border-blue-600' 
                        : 'text-gray-600 hover:bg-gray-100 hover:text-gray-900 border-l-4 border-transparent';
                    
                    return `
                        <button onclick="app.setChapter('${ch.id}')" class="w-full text-left px-3 py-2 rounded-md text-sm font-medium transition-colors ${activeClasses}">
                            ${ch.title}
                        </button>
                    `;
                }).join('');
            },

            renderMain() {
                const main = document.getElementById('main-content');
                const currentData = CHAPTER_DATA.find(ch => ch.id === this.state.activeChapter);

                if (this.state.activeTab === 'guide') {
                    main.innerHTML = `<div class="max-w-4xl mx-auto">${GUIDE_CONTENT}</div>`;
                    return;
                }

                if (this.state.activeTab === 'theory') {
                    main.innerHTML = `
                        <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden mb-12">
                            <div class="bg-gradient-to-r from-blue-50 to-white px-6 py-4 border-b border-gray-200">
                                <h2 class="text-2xl font-bold text-gray-800">${currentData.title}</h2>
                                <p class="text-sm text-gray-500 mt-1">Tóm tắt công thức & Lý thuyết trọng tâm</p>
                            </div>
                            <div class="p-6 animate-fade-in text-gray-800 leading-relaxed">${currentData.theory}</div>
                        </div>`;
                    return;
                }

                // QUIZ MODE with SRS
                const session = this.state.sessions[this.state.activeChapter];
                const totalQuestions = currentData.questions.length;
                const completedCount = session.completedSet.size;
                const progressPct = Math.round((completedCount / totalQuestions) * 100) || 0;

                let contentHTML = `
                    <div class="mb-6 bg-gray-100 rounded-full h-4 overflow-hidden border border-gray-200 relative">
                        <div class="bg-blue-500 h-full transition-all duration-500" style="width: ${progressPct}%"></div>
                        <span class="absolute inset-0 flex justify-center items-center text-[10px] font-bold ${progressPct > 50 ? 'text-white' : 'text-blue-900'}">Đã thuộc: ${completedCount}/${totalQuestions} câu</span>
                    </div>
                    <div class="animate-fade-in space-y-6">
                `;

                // Render Queue
                session.queue.forEach((inst, index) => {
                    const item = currentData.questions[inst.qIndex];
                    const instId = inst.instId;
                    const rating = session.ankiRatings[instId];
                    const selectedOpt = session.answers[instId];
                    const hasSelectedAnswer = selectedOpt !== undefined;

                    // 1. If rated, collapse the card
                    if (rating) {
                        const isDone = rating === 'good' || rating === 'easy';
                        const statusText = isDone ? '✅ Đã hoàn thành' : '🔄 Sẽ lặp lại thình lình để ôn tập';
                        const bgCol = isDone ? 'bg-green-50 text-green-800 border-green-200' : 'bg-orange-50 text-orange-800 border-orange-200';
                        
                        contentHTML += `
                            <div class="rounded-lg border p-3 shadow-sm flex items-center justify-between opacity-70 ${bgCol}">
                                <span class="text-sm font-medium line-clamp-1 flex-1 mr-4">Câu ${inst.qIndex + 1}: ${item.q.substring(0, 40)}...</span>
                                <span class="text-xs font-bold px-2 py-1 rounded bg-white bg-opacity-50 shrink-0">${statusText}</span>
                            </div>
                        `;
                        return;
                    }

                    // 2. Full active card
                    const optionsHTML = item.options.map((opt, optIndex) => {
                        const isSelected = selectedOpt === optIndex;
                        const isCorrect = item.correct === optIndex;
                        
                        let labelClass = 'bg-gray-50 border-gray-200 hover:bg-gray-100 cursor-pointer';
                        let badgeHTML = '';

                        // Color Logic upon selection
                        if (hasSelectedAnswer) {
                            if (isCorrect) {
                                // Right answer -> Green
                                labelClass = 'bg-green-100 border-green-500 text-green-900 shadow-sm font-bold ring-2 ring-green-300';
                                badgeHTML = `<span class="ml-auto text-green-600 bg-white rounded-full px-2 text-xs font-bold border border-green-200 animate-slide-up">ĐÚNG</span>`;
                            } else if (isSelected && !isCorrect) {
                                // Wrong selected -> Red
                                labelClass = 'bg-red-50 border-red-400 text-red-800 shadow-sm font-medium opacity-80 line-through';
                                badgeHTML = `<span class="ml-auto text-red-600 bg-white rounded-full px-2 text-xs font-bold border border-red-200 animate-slide-up">SAI</span>`;
                            } else {
                                // Wrong unselected -> Dim
                                labelClass = 'bg-gray-50 border-gray-200 opacity-40 cursor-default';
                            }
                        }

                        // Disabled click if already answered
                        const clickHandler = hasSelectedAnswer ? '' : `onclick="app.handleAnswer('${instId}', ${optIndex})"`;

                        return `
                            <div ${clickHandler} class="flex items-center p-3 rounded-lg border transition-all duration-300 ${labelClass}">
                                <div class="flex items-center h-5">
                                    <input type="radio" ${isSelected ? 'checked' : ''} ${hasSelectedAnswer ? 'disabled' : ''} class="focus:ring-blue-500 h-4 w-4 text-blue-600" />
                                </div>
                                <div class="ml-3 text-sm flex-1 leading-relaxed">${opt}</div>
                                ${badgeHTML}
                            </div>
                        `;
                    }).join('');

                    let experimentHTML = '';
                    if (hasSelectedAnswer && item.experiment) {
                        experimentHTML = `
                            <div class="mt-5 animate-slide-up border-t border-gray-100 pt-4">
                                <div class="p-4 bg-blue-50 border border-blue-200 rounded-lg shadow-inner mb-4">
                                    <p class="text-sm text-blue-900 leading-relaxed font-medium">${item.experiment}</p>
                                </div>
                                <div class="p-4 bg-gray-50 border border-gray-200 rounded-lg">
                                    <p class="text-sm font-bold text-gray-700 mb-3 text-center uppercase tracking-wider">Đánh giá độ hiểu bài (Anki)</p>
                                    <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                                        <button onclick="app.handleAnki('${instId}', ${inst.qIndex}, 'again')" class="px-2 py-2 text-xs font-bold rounded text-white bg-red-500 hover:bg-red-600 shadow transition-colors">🔴 Lại (Quên sạch)</button>
                                        <button onclick="app.handleAnki('${instId}', ${inst.qIndex}, 'hard')" class="px-2 py-2 text-xs font-bold rounded text-white bg-orange-500 hover:bg-orange-600 shadow transition-colors">🟠 Khó (Hơi rối)</button>
                                        <button onclick="app.handleAnki('${instId}', ${inst.qIndex}, 'good')" class="px-2 py-2 text-xs font-bold rounded text-white bg-green-500 hover:bg-green-600 shadow transition-colors">🟢 Tốt (Hiểu rõ)</button>
                                        <button onclick="app.handleAnki('${instId}', ${inst.qIndex}, 'easy')" class="px-2 py-2 text-xs font-bold rounded text-white bg-blue-500 hover:bg-blue-600 shadow transition-colors">🔵 Dễ (Nhớ liền)</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    }

                    contentHTML += `
                        <div class="bg-white rounded-xl border border-gray-300 p-5 shadow-md hover:shadow-lg transition-shadow relative">
                            <span class="absolute -top-3 left-4 bg-gray-800 text-white text-[10px] font-bold px-2 py-1 rounded-full shadow">Câu ${inst.qIndex + 1}</span>
                            <p class="font-bold text-gray-800 mb-4 mt-2 text-base leading-relaxed">${item.q}</p>
                            <div class="space-y-2">
                                ${optionsHTML}
                            </div>
                            ${experimentHTML}
                        </div>
                    `;
                });

                if (completedCount === totalQuestions) {
                    contentHTML += `
                        <div class="text-center pt-8 pb-4 animate-slide-up">
                            <div class="inline-block p-4 rounded-full bg-green-100 mb-4">
                                <span class="text-4xl">🎉</span>
                            </div>
                            <h3 class="text-xl font-bold text-green-700">Xuất sắc!</h3>
                            <p class="text-gray-500 mt-2">Em đã hoàn thành trọn vẹn thuật toán Anki cho Chương này.</p>
                        </div>
                    `;
                } else {
                    contentHTML += `<div class="text-center pt-8 pb-4 opacity-50"><p class="text-gray-400 text-sm">-- Hết danh sách chờ --</p></div>`;
                }

                contentHTML += `</div>`; // Close space-y-6

                main.innerHTML = `
                    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden mb-12">
                        <div class="bg-gradient-to-r from-blue-50 to-white px-6 py-4 border-b border-gray-200">
                            <h2 class="text-2xl font-bold text-gray-800">${currentData.title}</h2>
                            <p class="text-sm text-gray-500 mt-1">Câu hỏi trắc nghiệm tự luyện & Đánh giá Anki</p>
                        </div>
                        <div class="p-4 sm:p-6">
                            ${contentHTML}
                        </div>
                    </div>
                `;
            }
        };

        // Khởi chạy App
        app.init();
    </script>
</body>
</html>
