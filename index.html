<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô Phỏng Hệ Tọa Độ Descartes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Prevent scrollbars from canvas resizing */
        }
        canvas {
            background-color: #1a202c; /* dark gray */
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        .input-group {
            background-color: #2d3748; /* gray-700 */
            border-radius: 0.5rem;
            padding: 1rem;
        }
        .label-coord {
            font-size: 1.25rem;
            font-weight: 700;
        }
        .btn-primary {
            background-color: #4299e1; /* blue-500 */
            transition: background-color 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #3182ce; /* blue-600 */
        }
        .btn-secondary {
            background-color: #4a5568; /* gray-600 */
            transition: background-color: 0.3s ease;
        }
        .btn-secondary:hover {
            background-color: #2d3748; /* gray-700 */
        }
        #info-panel {
            min-height: 50px;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center h-screen p-4">

    <div class="w-full max-w-6xl mx-auto flex flex-col lg:flex-row gap-6 h-full">
        <!-- Control Panel -->
        <div class="lg:w-1/3 w-full flex flex-col gap-4 p-6 bg-gray-800 rounded-lg shadow-2xl">
            <h1 class="text-3xl font-bold text-center text-blue-400">Khám Phá Tọa Độ 🚀</h1>
            <p class="text-center text-gray-400">Nhập tọa độ và xem điều kỳ diệu xảy ra!</p>
            
            <div class="input-group flex items-center justify-around gap-4">
                <div class="flex items-center gap-3">
                    <label for="x-coord" class="label-coord text-red-400">X:</label>
                    <input type="number" id="x-coord" value="3" class="w-24 p-2 rounded bg-gray-900 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-red-500 text-center text-lg">
                </div>
                <div class="flex items-center gap-3">
                    <label for="y-coord" class="label-coord text-green-400">Y:</label>
                    <input type="number" id="y-coord" value="4" class="w-24 p-2 rounded bg-gray-900 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-green-500 text-center text-lg">
                </div>
            </div>

            <div class="flex flex-col gap-3 mt-4">
                <button id="plot-btn" class="w-full btn-primary text-white font-bold py-3 px-4 rounded-lg text-lg">
                    Vẽ Điểm
                </button>
                 <button id="reset-btn" class="w-full btn-secondary text-white font-bold py-2 px-4 rounded-lg">
                    Làm Mới
                </button>
            </div>
            
            <div id="info-panel" class="mt-auto p-4 bg-gray-900 rounded-lg border border-gray-700 text-center">
                <p id="info-text" class="text-gray-300">Sẵn sàng để bắt đầu!</p>
            </div>
        </div>

        <!-- Canvas -->
        <div class="lg:w-2/3 w-full h-full min-h-0">
            <canvas id="coord-canvas" class="w-full h-full"></canvas>
        </div>
    </div>

    <script>
        // --- SETUP ---
        const canvas = document.getElementById('coord-canvas');
        const ctx = canvas.getContext('2d');
        const plotBtn = document.getElementById('plot-btn');
        const resetBtn = document.getElementById('reset-btn');
        const xInput = document.getElementById('x-coord');
        const yInput = document.getElementById('y-coord');
        const infoText = document.getElementById('info-text');

        let originX, originY;
        let unit = 30; // pixels per unit
        let animationFrameId;

        // --- CORE DRAWING FUNCTIONS ---

        function setupCanvas() {
            // Set canvas resolution to match its display size
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);

            originX = canvas.width / (2 * dpr);
            originY = canvas.height / (2 * dpr);
            
            drawGrid();
        }

        function drawGrid() {
            const dpr = window.devicePixelRatio || 1;
            const width = canvas.width / dpr;
            const height = canvas.height / dpr;

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw grid lines
            ctx.strokeStyle = '#2d3748'; // gray-700
            ctx.lineWidth = 1;
            
            // Vertical lines
            for (let x = originX + unit; x < width; x += unit) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            for (let x = originX - unit; x > 0; x -= unit) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            // Horizontal lines
            for (let y = originY + unit; y < height; y += unit) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
            for (let y = originY - unit; y > 0; y -= unit) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }

            // Draw axes
            ctx.strokeStyle = '#a0aec0'; // gray-400
            ctx.lineWidth = 2;
            // X-axis (Trục hoành)
            ctx.beginPath();
            ctx.moveTo(0, originY);
            ctx.lineTo(width, originY);
            ctx.stroke();
            // Y-axis (Trục tung)
            ctx.beginPath();
            ctx.moveTo(originX, 0);
            ctx.lineTo(originX, height);
            ctx.stroke();
            
            // Draw labels and numbers
            ctx.fillStyle = '#cbd5e0'; // gray-300
            ctx.font = '14px Inter';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Axis labels
            ctx.fillText('Ox (Hoành)', width - 40, originY - 15);
            ctx.fillText('Oy (Tung)', originX + 30, 15);

            // Numbers on X-axis
            for(let i = 1; (originX + i * unit) < width; i++) {
                ctx.fillText(i, originX + i * unit, originY + 15);
                ctx.fillText(-i, originX - i * unit, originY + 15);
            }
             // Numbers on Y-axis
            for(let i = 1; (originY + i * unit) < height; i++) {
                ctx.fillText(-i, originX - 15, originY + i * unit);
                ctx.fillText(i, originX - 15, originY - i * unit);
            }
            
            // Origin
            ctx.fillText('O(0,0)', originX - 25, originY + 20);
        }

        function toCanvasX(x) {
            return originX + x * unit;
        }

        function toCanvasY(y) {
            return originY - y * unit;
        }
        
        function plotPoint(x, y, color = '#63b3ed', label = `P(${x}, ${y})`) {
            const canvasX = toCanvasX(x);
            const canvasY = toCanvasY(y);
            
            // Draw point
            ctx.beginPath();
            ctx.arc(canvasX, canvasY, 6, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            
            // Draw label
            ctx.fillStyle = '#f7fafc'; // gray-100
            ctx.font = 'bold 16px Inter';
            ctx.fillText(label, canvasX + 10, canvasY - 20);
        }

        // --- ANIMATION LOGIC ---
        function animatePlot(targetX, targetY) {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
            
            plotBtn.disabled = true;
            plotBtn.classList.add('opacity-50', 'cursor-not-allowed');

            let currentX = 0;
            const duration = 1000; // ms for each phase
            let startTime = null;

            function animateX(timestamp) {
                if (!startTime) startTime = timestamp;
                const progress = Math.min((timestamp - startTime) / duration, 1);
                
                currentX = targetX * progress;
                
                drawGrid();
                
                // Draw path line for X
                ctx.beginPath();
                ctx.moveTo(toCanvasX(0), toCanvasY(0));
                ctx.lineTo(toCanvasX(currentX), toCanvasY(0));
                ctx.strokeStyle = '#f56565'; // red-500
                ctx.lineWidth = 4;
                ctx.setLineDash([5, 5]);
                ctx.stroke();
                ctx.setLineDash([]); // Reset dash

                infoText.textContent = `1. Di chuyển ngang ${targetX} đơn vị dọc trục Ox...`;

                if (progress < 1) {
                    animationFrameId = requestAnimationFrame(animateX);
                } else {
                    startTime = null; // Reset for next animation phase
                    animationFrameId = requestAnimationFrame(animateY);
                }
            }

            let currentY = 0;
            function animateY(timestamp) {
                if (!startTime) startTime = timestamp;
                const progress = Math.min((timestamp - startTime) / duration, 1);

                currentY = targetY * progress;
                
                drawGrid();
                
                // Draw static X path
                ctx.beginPath();
                ctx.moveTo(toCanvasX(0), toCanvasY(0));
                ctx.lineTo(toCanvasX(targetX), toCanvasY(0));
                ctx.strokeStyle = '#f56565';
                ctx.lineWidth = 4;
                ctx.setLineDash([5, 5]);
                ctx.stroke();
                
                // Draw animated Y path
                ctx.beginPath();
                ctx.moveTo(toCanvasX(targetX), toCanvasY(0));
                ctx.lineTo(toCanvasX(targetX), toCanvasY(currentY));
                ctx.strokeStyle = '#48bb78'; // green-500
                ctx.lineWidth = 4;
                ctx.stroke();
                ctx.setLineDash([]);
                
                infoText.textContent = `2. Di chuyển dọc ${targetY} đơn vị song song trục Oy...`;

                if (progress < 1) {
                    animationFrameId = requestAnimationFrame(animateY);
                } else {
                    plotPoint(targetX, targetY);
                    infoText.textContent = `Hoàn thành! Đã xác định điểm P(${targetX}, ${targetY}). 🎉`;
                    plotBtn.disabled = false;
                    plotBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            }

            animationFrameId = requestAnimationFrame(animateX);
        }

        // --- EVENT LISTENERS ---
        plotBtn.addEventListener('click', () => {
            const x = parseFloat(xInput.value) || 0;
            const y = parseFloat(yInput.value) || 0;
            animatePlot(x, y);
        });
        
        resetBtn.addEventListener('click', () => {
             if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
            drawGrid();
            infoText.textContent = 'Đã làm mới. Hãy thử tọa độ khác!';
            plotBtn.disabled = false;
            plotBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        });

        window.addEventListener('resize', setupCanvas);

        // --- INITIALIZATION ---
        setupCanvas();

    </script>
</body>
</html>
